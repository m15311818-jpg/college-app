<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحاضرات</title>
    <!-- ربط مكتبة Firebase -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background: #f7f9fc; padding: 15px; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; }
        .list-container { max-width: 500px; margin: 0 auto; }
        .file-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 5px solid #2a5298; animation: slideIn 0.3s ease-out; }
        .file-info { font-size: 16px; font-weight: bold; color: #333; }
        .btn-download { background: #00c853; color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-download:active { background: #00c853; transform: scale(0.95); }
        .empty-state { text-align: center; color: #999; margin-top: 40px; font-size: 16px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="list-container">
    <header>
        <h1>📚 مركز تحميل المحاضرات والملفات</h1>
    </header>

    <div id="files-list">
        <div class="empty-state">جاري فحص المكتبة ولحظات وتظهر الملفات...</div>
    </div>
</div>

<script>
    // ⚠️ يجب أن تكون نفس إعدادات Firebase الموجودة في لوحة التحكم
    const firebaseConfig = {
        databaseURL: "https://YOUR_PROJECT_://firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // الاستماع اللحظي (Realtime) لأي ملف جديد يترفع
    database.ref('uploaded_files').orderByChild('timestamp').on('value', (snapshot) => {
        const filesListDiv = document.getElementById('files-list');
        filesListDiv.innerHTML = ''; // مسح القائمة القديمة

        if (!snapshot.exists()) {
            filesListDiv.innerHTML = '<div class="empty-state">لا توجد ملفات مرفوعة حالياً.</div>';
            return;
        }

        // ترتيب الملفات من الأحدث للأقدم
        let filesArray = [];
        snapshot.forEach((childSnapshot) => {
            filesArray.unshift(childSnapshot.val());
        });

        filesArray.forEach((file) => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <div class="file-info">📄 ${file.title}</div>
                <a href="${file.url}" target="_blank" class="btn-download">فتح / تحميل</a>
            `;
            filesListDiv.appendChild(card);
        });
    });
</script>
</body>
</html>
